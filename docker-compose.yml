services:
  db:
    image: postgis/postgis:16-3.4
    container_name: katabatic_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: katabatic
      POSTGRES_USER: katabatic
      POSTGRES_PASSWORD: katabatic
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katabatic -d katabatic"]
      interval: 5s
      timeout: 5s
      retries: 10
